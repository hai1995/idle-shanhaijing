<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#1E1C18">
<meta name="description" content="《山海经》题材的纯前端放置挂机游戏：巡行山海，著录万物。">
<!-- 群里贴数字（QQ 群号）时，iOS 会自作主张把它认成电话号码并染蓝；关掉 */
<meta name="format-detection" content="telephone=no,email=no,address=no">
<!-- 分享到群 / 空间时，标题与描述由这两条决定（不加的话只剩裸链接） -->
<meta property="og:type" content="website">
<meta property="og:locale" content="zh_CN">
<meta property="og:title" content="山海经 · 著录">
<meta property="og:description" content="《山海经》题材的纯前端放置挂机游戏：巡行山海，著录万物。">
<title>山海经 · 著录</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='2' fill='%23B03A2B'/><text x='16' y='23' font-size='19' text-anchor='middle' fill='%23FCFBF6' font-family='KaiTi,STKaiti,serif'>山</text></svg>">
<!-- 昼夜：在首屏绘制前定好主题，避免由亮转暗的闪烁 -->
<script>
(function(){
  try{
    var t = localStorage.getItem('shj-theme');
    if(!t && window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches) t = 'night';
    if(t === 'night') document.documentElement.dataset.theme = 'night';
  }catch(e){}
})();
</script>
<link rel="stylesheet" href="style.css?v=1.31.109">
</head>
<body onload="init()">
<div id="app">

  <!-- 吸顶：墨色书脊（顶栏）+ 纸质仪表带（状态条）+ 全局指引条 -->
  <div id="topdock">
    <header id="topbar">
      <div class="left">
        <span class="seal" aria-hidden="true"><i>山</i><i>海</i></span>
        <span class="title"><b>山海经</b><i>著录</i><small>南山经</small><b id="nickTag" class="hidden"></b></span>
        <span class="stat" data-s="级" title="总等级：二十六门技艺之和">
          <i class="lb">总等级</i><b id="totalLevel">0</b>
        </span>
        <span class="stat" data-s="录" title="已著录条目 / 全图鉴条目">
          <i class="lb">已录</i><b id="recordCount">0/0</b>
          <span class="meter" aria-hidden="true"><i id="recordMeter"></i></span>
        </span>
        <span class="stat" data-s="贝" title="贝币">
          <i class="lb">贝币</i><b id="shellCount">0</b>
        </span>
      </div>
      <!-- 增益一览：书脊最右一枚图标，点开浮层看御使 / 征兆 / 临时增益 -->
      <button id="buffBtn" class="buff-btn" type="button" title="增益一览" aria-haspopup="dialog" aria-expanded="false">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"
          stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M10 3.4 11.6 9.4 17.6 11 11.6 12.6 10 18.6 8.4 12.6 2.4 11 8.4 9.4Z"/>
          <path d="M18.6 2.8 19.4 5.6 22.2 6.4 19.4 7.2 18.6 10 17.8 7.2 15 6.4 17.8 5.6Z"/>
        </svg>
        <i id="buffCount" class="bb-n hidden">0</i>
      </button>
    </header>

    <!-- 仪表带：当前行动 / 进度 / 停止（气血只在征伐页的战斗面板里，此处不再重复） -->
    <div id="statusbar">
      <span id="activityText" class="act-link" role="button" tabindex="0" title="点击前往对应页" onclick="UI.gotoActivity()">空闲</span>
      <div id="actionProg" class="hidden"><div id="actionProgFill"></div></div>
      <button id="btnStop" class="btn-mini" type="button">停止</button>
    </div>
    <!-- 现场：当前行动的小画面（v1.31.54）。静态节点 + 增量更新——
         若随页面一起 innerHTML 重绘，动画每渲染一次就归零，等于没有动画。 -->
    <div id="sceneBar" class="hidden"></div>
    <div id="guidance" class="hint-banner hidden"></div>
  </div>

  <!-- 侧边导航 + 主内容：PC 侧边栏常驻，移动端由左侧图标栏唤出抽屉 -->
  <div id="shell">
    <nav id="tabs"><!-- 各页签由 JS 渲染 --></nav>
    <main id="content"><!-- 各页由 JS 渲染 --></main>
  </div>

  <!-- 移动端功能总入口 -->
  <button id="fab" type="button" title="功能菜单">☰</button>
  <div id="drawerMask" class="hidden"></div>

  <!-- 增益一览浮层（书脊右上角图标唤出，点击空白 / Esc 收起） -->
  <div id="buffPop" class="buff-pop hidden" role="dialog" aria-label="增益一览"></div>

</div>

<!-- 浮动提示层 -->
<div id="toasts" aria-live="polite" role="status"></div>
<div id="modal" class="hidden"><div id="modalBox"></div></div>

<!-- 长页回到顶部（滚动后浮现） -->
<!-- 新版本提示：index.html 自身没有 ?v=，主屏幕里的旧版可能一直不刷新，
     靠一份 no-store 的 version.json 与页面里的 GAME_META 对一下（见下面的内联脚本）。 -->
<div id="updateBar" class="update-bar hidden" role="status">
  <span>有新版本 <b></b>，点此刷新</span><i aria-label="暂时关闭">×</i>
</div>

<button id="btnTop" class="to-top" type="button" aria-label="回到顶部" title="回到顶部">
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 14l6-6 6 6"/></svg>
</button>

<script>
/* 缓存自检（内联，不依赖任何模块）：index.html 自身没有 ?v=，主屏幕里的独立实例
   可能一直拿着旧页面——旧页面又去引用同名（旧版本串）的脚本，于是「改了手机不生效」。
   这里拿一份 no-store 的 version.json 跟页面里的 GAME_META 对一下，不一致就提示刷新。
   任何一步失败都安静退出：这只是个提示，不该影响开局。 */
(function(){
  function show(v){
    var el = document.getElementById('updateBar');
    if (!el) return;
    var b = el.querySelector('b'); if (b) b.textContent = 'v' + v;
    el.classList.remove('hidden');
    el.addEventListener('click', function(){
      // 带一个随机参数重取 index.html，绕开它自己的缓存
      location.replace(location.pathname + '?_r=' + Date.now());
    });
    var x = el.querySelector('i');
    if (x) x.addEventListener('click', function(ev){ ev.stopPropagation(); el.classList.add('hidden'); });
  }
  window.addEventListener('load', function(){
    setTimeout(function(){
      try {
        fetch('version.json?t=' + Date.now(), { cache:'no-store' })
          .then(function(r){ return r.ok ? r.json() : null; })
          .then(function(d){
            if (!d || !d.version) return;
            if (typeof GAME_META === 'undefined' || !GAME_META.version) return;
            if (String(d.version) !== String(GAME_META.version)) show(d.version);
          })
          .catch(function(){});
      } catch(e){}
    }, 1500);
  });
})();
</script>
</body>
</html>
